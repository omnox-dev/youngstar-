name: 🚀 Youngstar CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ----------------------------------------------------
  # STAGE 1: Backend CI (Lint, Test, Audit)
  # ----------------------------------------------------
  backend-ci:
    name: ⚙️ Backend CI Check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: 📦 Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: 🔒 Security Audit
        run: |
          cd backend
          npm audit --audit-level=high || true

      - name: 🧪 Verify Backend Environment Schema
        run: |
          cd backend
          if [ -f .env.example ]; then echo "✓ Environment template verified"; fi

  # ----------------------------------------------------
  # STAGE 2: Frontend CI (Build, Lint, Assets Check)
  # ----------------------------------------------------
  frontend-ci:
    name: 🎨 Frontend CI Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: 📦 Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: 🏗️ Build Vite Production Bundle
        run: |
          cd frontend
          npm run build

      - name: 📂 Upload Production Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ----------------------------------------------------
  # STAGE 3: Continuous Deployment (CD Trigger)
  # ----------------------------------------------------
  deploy:
    name: 🚀 Continuous Deployment (Production)
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📥 Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: 📢 Deployment Status
        run: |
          echo "🎉 CI Passed successfully!"
          echo "🚀 Triggering automatic production deployment for Youngstar..."
